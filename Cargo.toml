[package]
name = "crab-knife"
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
base64 = "0.22.1"
anyhow = "1"
gpui = "0.2.2"
gpui-component = "0.5.1"
getrandom = "0.4.2"
md-5 = "0.10.6"
qrcode = "0.14.1"
regex = "1"
sha2 = "0.10.9"

[package.metadata.packager]
productName = "CrabKnife"
identifier = "moe.keo.crabknife"
formats = ["wix", "dmg"]
before-packaging-command = "cargo build --release"
